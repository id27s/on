name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Giai nen source code
        run: unzip -o NhimApp.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > NhimApp/local.properties

      - name: Build debug APK
        working-directory: NhimApp
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nhim-app-debug-apk
          path: NhimApp/app/build/outputs/apk/debug/app-debug.apk
